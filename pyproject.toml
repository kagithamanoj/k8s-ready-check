[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-ready-check"
version = "0.1.0"
description = "Check a Kubernetes workload manifest for production-readiness basics before you roll it out."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Kagitha" }]
dependencies = ["pyyaml"]

[project.scripts]
k8s-ready-check = "k8s_ready_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
